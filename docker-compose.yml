# Postgres para desarrollo local. Las credenciales coinciden con apps/api/.env.example
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: greenlight
      POSTGRES_PASSWORD: greenlight
      POSTGRES_DB: greenlight
    ports:
      # Solo para esta máquina: con '5432:5432' cualquiera en la red podría entrar con estas credenciales
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U greenlight -d greenlight']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
